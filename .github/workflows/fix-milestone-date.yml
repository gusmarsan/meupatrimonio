name: Fix milestone date format

on:
  push:
    paths:
      - '.github/workflows/fix-milestone-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show milestone dates as DD/MM/YYYY
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'const MILESTONE_STEP=50000;\nfunction milestoneData'
          helper = 'const MILESTONE_STEP=50000;\nfunction milestoneDate(ts){if(!ts)return"—";let d=new Date(Number(ts));if(Number.isNaN(d.getTime()))return"—";return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`}\nfunction milestoneData'
          if text.count(marker) != 1: raise RuntimeError(f'helper marker: {text.count(marker)} matches')
          text = text.replace(marker, helper, 1)
          old_item = 'items.push({target,month:closing.month})'
          new_item = 'items.push({target,month:closing.month,reachedAt:Number(closing.updatedAt)||0})'
          if text.count(old_item) != 1: raise RuntimeError(f'item marker: {text.count(old_item)} matches')
          text = text.replace(old_item, new_item, 1)
          old_date = '${mlabel(item.month)}</span></article>'
          new_date = '${milestoneDate(item.reachedAt)}</span></article>'
          if text.count(old_date) != 1: raise RuntimeError(f'date marker: {text.count(old_date)} matches')
          text = text.replace(old_date, new_date, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Show full milestone dates"
          git push origin main
