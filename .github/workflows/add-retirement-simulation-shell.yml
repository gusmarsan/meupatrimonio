name: Retirement simulation visual shell

on:
  push:
    paths:
      - '.github/workflows/add-retirement-simulation-shell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add retirement simulation visual shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<p id="wealthSplitWarning" class="wealth-warning hidden">A soma dos 2 campos não está igual ao patrimônio.</p>'
          section = '''<p id="wealthSplitWarning" class="wealth-warning hidden">A soma dos 2 campos não está igual ao patrimônio.</p>\n<section class="retirement-simulation" aria-labelledby="retirementSimulationTitle">\n  <div class="retirement-simulation-head">\n    <p class="section-kicker">Cenários</p>\n    <h2 id="retirementSimulationTitle">Simulação de aposentadoria</h2>\n  </div>\n  <div class="retirement-simulation-grid">\n    <article class="retirement-simulation-card retirement-simulation-card--conservative"><span class="retirement-simulation-index">01</span><h3>Conservador</h3></article>\n    <article class="retirement-simulation-card retirement-simulation-card--moderate"><span class="retirement-simulation-index">02</span><h3>Moderado</h3></article>\n    <article class="retirement-simulation-card retirement-simulation-card--optimistic"><span class="retirement-simulation-index">03</span><h3>Otimista</h3></article>\n  </div>\n</section>'''
          if text.count(marker) != 1:
              raise RuntimeError(f'HTML marker matches: {text.count(marker)}')
          text = text.replace(marker, section, 1)

          css = '''\n/* Retirement simulation — visual shell only */\n.retirement-simulation{margin-top:44px;padding-top:38px;border-top:1px solid var(--line)}\n.retirement-simulation-head{margin-bottom:18px}\n.retirement-simulation-head .section-kicker{margin-bottom:7px}\n.retirement-simulation-head h2{margin:0;font-family:"Inter",sans-serif;font-size:1.55rem;font-weight:600;letter-spacing:-.035em;color:var(--txt)}\n.retirement-simulation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}\n.retirement-simulation-card{position:relative;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;padding:17px 16px;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}\n.retirement-simulation-card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#7e8d85}\n.retirement-simulation-card--moderate::before{background:var(--green)}\n.retirement-simulation-card--optimistic::before{background:#315f4d}\n.retirement-simulation-index{position:absolute;top:14px;right:14px;color:var(--mut);font-size:.63rem;font-weight:700;letter-spacing:.08em}\n.retirement-simulation-card h3{margin:0;color:var(--txt);font-size:.92rem;font-weight:650;letter-spacing:-.02em}\n@media(min-width:761px){\n  .retirement-simulation{margin-top:58px;padding-top:46px}\n  .retirement-simulation-head{margin-bottom:22px}\n  .retirement-simulation-head h2{font-size:1.9rem}\n  .retirement-simulation-grid{gap:16px}\n  .retirement-simulation-card{min-height:150px;padding:22px 20px;border-color:#17201b17;border-radius:13px;background:#fff}\n  .retirement-simulation-card h3{font-size:1rem}\n}\n@media(max-width:430px){\n  .retirement-simulation{margin-top:36px;padding-top:32px}\n  .retirement-simulation-head{margin-bottom:16px}\n  .retirement-simulation-head h2{font-size:1.45rem}\n  .retirement-simulation-grid{grid-template-columns:1fr;gap:10px}\n  .retirement-simulation-card{min-height:92px;padding:16px 15px}\n}\n'''
          style_marker = '</style>'
          if text.count(style_marker) != 1:
              raise RuntimeError(f'style marker matches: {text.count(style_marker)}')
          text = text.replace(style_marker, css + style_marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add retirement simulation visual shell"
          git push origin main
