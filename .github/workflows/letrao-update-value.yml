name: Letrao investment update CTA
on:
  push:
    paths:
      - '.github/workflows/letrao-update-value.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace helper copy with update CTA in Letrao
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')

          if "meu-patrimonio-pwa-v18" not in s:
              raise SystemExit('Expected cache v18 not found')
          s = s.replace("meu-patrimonio-pwa-v18", "meu-patrimonio-pwa-v19", 1)

          old = '  body.letrao-mode #home .cat .tap{font-size:.9rem;color:#44534b}\n'
          new = '''  body.letrao-mode #home .cat .tap{display:inline-flex;margin-top:12px;font-size:0;color:inherit}\n  body.letrao-mode #home .cat .tap::after{content:"Atualizar valor";min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 17px;border:1px solid #17201b;border-radius:10px;background:#17201b;color:#fff;font-size:.94rem;font-weight:700;line-height:1;white-space:nowrap}\n  body.letrao-mode #categorySheet #sheetPrint{display:none!important}\n'''
          if old not in s:
              raise SystemExit('Expected Letrao investment helper style not found')
          s = s.replace(old, new, 1)

          old_ref = "  const manualButton=document.getElementById('manual');\n"
          new_ref = old_ref + "  const sheetManualButton=document.getElementById('sheetManual');\n  const cats=document.getElementById('cats');\n"
          if old_ref not in s:
              raise SystemExit('Expected Letrao manual button reference not found')
          s = s.replace(old_ref, new_ref, 1)

          old_apply = "    if(manualButton)manualButton.textContent=active?'Inserir valores':'Adicionar valor manualmente';\n"
          new_apply = old_apply + "    if(sheetManualButton)sheetManualButton.textContent=active?'Atualizar valor':'Inserir manualmente';\n"
          if old_apply not in s:
              raise SystemExit('Expected Letrao apply text block not found')
          s = s.replace(old_apply, new_apply, 1)

          hook = "  button.addEventListener('click',()=>{\n"
          direct = "  if(cats)cats.addEventListener('click',event=>{if(document.body.classList.contains('letrao-mode')&&event.target.closest?.('.tap'))setTimeout(()=>sheetManualButton?.click(),0)});\n"
          if hook not in s:
              raise SystemExit('Expected Letrao button hook not found')
          s = s.replace(hook, direct + hook, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Add Atualizar valor CTA to Modo Letrao"
          git push
