name: Restore CSV and milestones in Letrao
on:
  push:
    paths:
      - '.github/workflows/restore-letrao-csv-milestones.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore CSV and milestones in simplified mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("meu-patrimonio-pwa-v11", "meu-patrimonio-pwa-v12")
          old = '''  body.letrao-mode #evolution #export,
  body.letrao-mode #evolution .rowact,
  body.letrao-mode #evolution .milestones-section,
'''
          new = '''  body.letrao-mode #evolution .rowact,
'''
          if old not in s:
              raise SystemExit('Expected Letrao hide block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Restore CSV export and milestones in Modo Letrao"
          git push
