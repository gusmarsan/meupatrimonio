name: Add editable projection target

on:
  push:
    paths:
      - '.github/workflows/add-editable-projection-target.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply editable projection target
        run: python .github/scripts/editable_projection_target.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Make projection target editable"
          git push origin main
