name: Retirement scenario calculations

on:
  push:
    paths:
      - '.github/workflows/add-retirement-scenario-calculations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add retirement scenario calculations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          def rep(old,new,label):
              global text
              count=text.count(old)
              if count!=1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text=text.replace(old,new,1)

          rep('<article class="retirement-simulation-card retirement-simulation-card--conservative"><span class="retirement-simulation-index">01</span><h3>Conservador</h3></article>', '<article class="retirement-simulation-card retirement-simulation-card--conservative"><span class="retirement-simulation-index">01</span><h3>Conservador</h3><p class="retirement-simulation-result-label">Você vai ter, em valores de hoje:</p><strong id="retirementSimulationConservativeValue" class="retirement-simulation-result">—</strong></article>', 'conservative card')
          rep('<article class="retirement-simulation-card retirement-simulation-card--moderate"><span class="retirement-simulation-index">02</span><h3>Moderado</h3></article>', '<article class="retirement-simulation-card retirement-simulation-card--moderate"><span class="retirement-simulation-index">02</span><h3>Moderado</h3><p class="retirement-simulation-result-label">Você vai ter, em valores de hoje:</p><strong id="retirementSimulationModerateValue" class="retirement-simulation-result">—</strong></article>', 'moderate card')
          rep('<article class="retirement-simulation-card retirement-simulation-card--optimistic"><span class="retirement-simulation-index">03</span><h3>Otimista</h3></article>', '<article class="retirement-simulation-card retirement-simulation-card--optimistic"><span class="retirement-simulation-index">03</span><h3>Otimista</h3><p class="retirement-simulation-result-label">Você vai ter, em valores de hoje:</p><strong id="retirementSimulationOptimisticValue" class="retirement-simulation-result">—</strong></article>', 'optimistic card')

          css='''\n/* Retirement simulation scenario results */\n.retirement-simulation-card{justify-content:flex-start}\n.retirement-simulation-card h3{margin-bottom:18px}\n.retirement-simulation-result-label{margin:0 0 6px;color:var(--mut);font-size:.67rem;line-height:1.4}\n.retirement-simulation-result{display:block;margin-top:auto;color:var(--txt);font-size:1.05rem;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n@media(min-width:761px){\n  .retirement-simulation-result-label{font-size:.72rem}\n  .retirement-simulation-result{font-size:1.35rem}\n}\n'''
          rep('</style>',css+'</style>','scenario results CSS')

          el_old='retirementSimulationFutureValue:$("#retirementSimulationFutureValue"),retirementSimulationAuto:$("#retirementSimulationAuto")'
          el_new='retirementSimulationFutureValue:$("#retirementSimulationFutureValue"),retirementSimulationConservativeValue:$("#retirementSimulationConservativeValue"),retirementSimulationModerateValue:$("#retirementSimulationModerateValue"),retirementSimulationOptimisticValue:$("#retirementSimulationOptimisticValue"),retirementSimulationAuto:$("#retirementSimulationAuto")'
          rep(el_old,el_new,'scenario element refs')

          render_old='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital;let future=retirementSimulationYears>0?value*Math.pow(1.006,retirementSimulationYears*12):null;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationFutureValue.textContent=future===null?"—":brl(future);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          render_new='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital,years=retirementSimulationYears>0?retirementSimulationYears:0;let future=years?value*Math.pow(1.006,years*12):null,conservative=years?value*Math.pow(1+(0.06-0.056),years):null,moderate=years?value*Math.pow(1+(0.08-0.056),years):null,optimistic=years?value*Math.pow(1+(0.1066-0.056),years):null;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationFutureValue.textContent=future===null?"—":brl(future);el.retirementSimulationConservativeValue.textContent=conservative===null?"—":brl(conservative);el.retirementSimulationModerateValue.textContent=moderate===null?"—":brl(moderate);el.retirementSimulationOptimisticValue.textContent=optimistic===null?"—":brl(optimistic);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          rep(render_old,render_new,'scenario calculation render')

          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add retirement scenario projections"
          git push origin main
