name: Remove print input from Letrao
on:
  push:
    paths:
      - '.github/workflows/remove-print-letrao.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove print and OCR entry from Letrao
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          if "meu-patrimonio-pwa-v14" not in s:
              raise SystemExit('Expected cache v14 not found')
          s = s.replace("meu-patrimonio-pwa-v14", "meu-patrimonio-pwa-v15", 1)
          needle = '  body.letrao-mode #home #graphBtn,\n  body.letrao-mode #projections .projection-target:has(+ .wealth-split),\n'
          replacement = '  body.letrao-mode #home #graphBtn,\n  body.letrao-mode #new #uploadLabel,\n  body.letrao-mode #new .note,\n  body.letrao-mode #review #more,\n  body.letrao-mode #projections .projection-target:has(+ .wealth-split),\n'
          if needle not in s:
              raise SystemExit('Expected Letrao hidden selector block not found')
          s = s.replace(needle, replacement, 1)
          old_refs = "  const homeActions=document.querySelector('#home .home-balance .actions');\n"
          new_refs = old_refs + "  const printInput=document.getElementById('files');\n  const manualButton=document.getElementById('manual');\n"
          if old_refs not in s:
              raise SystemExit('Expected Letrao script refs not found')
          s = s.replace(old_refs, new_refs, 1)
          old_apply = "    if(contributionButton){\n      if(active&&homeActions){homeActions.append(contributionButton)}\n      else if(contributionWrap&&contributionButton.parentElement!==contributionWrap){contributionWrap.insertBefore(contributionButton,contributionWrap.firstChild)}\n    }\n    if(active&&['settings','projections'].includes(document.body.dataset.view||''))homeNav?.click();\n"
          new_apply = "    if(contributionButton){\n      if(active&&homeActions){homeActions.append(contributionButton)}\n      else if(contributionWrap&&contributionButton.parentElement!==contributionWrap){contributionWrap.insertBefore(contributionButton,contributionWrap.firstChild)}\n    }\n    if(printInput)printInput.disabled=active;\n    if(manualButton)manualButton.textContent=active?'Inserir valores':'Adicionar valor manualmente';\n    if(active&&['settings','projections'].includes(document.body.dataset.view||''))homeNav?.click();\n"
          if old_apply not in s:
              raise SystemExit('Expected Letrao apply block not found')
          s = s.replace(old_apply, new_apply, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Remove print input from Modo Letrao"
          git push
