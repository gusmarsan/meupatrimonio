name: Restore Letrao projection cards
on:
  push:
    paths:
      - '.github/workflows/restore-letrao-projection-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore projection cards in Letrao
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')

          if "meu-patrimonio-pwa-v17" not in s:
              raise SystemExit('Expected cache v17 not found')
          s = s.replace("meu-patrimonio-pwa-v17", "meu-patrimonio-pwa-v18", 1)

          for selector in (
              '  body.letrao-mode #projections .projection-grid,\n',
              '  body.letrao-mode #projections .projection-note,\n',
          ):
              if selector not in s:
                  raise SystemExit(f'Expected hidden projection selector not found: {selector!r}')
              s = s.replace(selector, '', 1)

          anchor = '  body.letrao-mode #projections .projection-target-edit svg{width:22px;height:22px}\n'
          additions = (
              '  body.letrao-mode #projections .projection-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}\n'
              '  body.letrao-mode #projections .projection-case{padding:28px 22px;min-height:220px}\n'
              '  body.letrao-mode #projections .projection-case h3{font-size:1.05rem;line-height:1.35}\n'
              '  body.letrao-mode #projections .projection-rate{font-size:.9rem;margin-top:10px}\n'
              '  body.letrao-mode #projections .projection-case small{font-size:.88rem}\n'
              '  body.letrao-mode #projections .projection-date{font-size:1.55rem;margin-top:8px}\n'
              '  body.letrao-mode #projections .projection-previous{font-size:.86rem;line-height:1.45}\n'
              '  body.letrao-mode #projections .projection-previous b{font-size:.95rem}\n'
              '  body.letrao-mode #projections .projection-note{font-size:.92rem;line-height:1.55;color:#435149}\n'
          )
          if anchor not in s:
              raise SystemExit('Expected Letrao projection style anchor not found')
          if 'body.letrao-mode #projections .projection-case{padding:28px 22px;min-height:220px}' in s:
              raise SystemExit('Projection card styles already present')
          s = s.replace(anchor, anchor + additions, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Restore projection scenarios in Modo Letrao"
          git push
