name: Retirement simulation inputs

on:
  push:
    paths:
      - '.github/workflows/add-retirement-simulation-inputs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add retirement simulation inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          def rep(old,new,label):
              global text
              count=text.count(old)
              if count!=1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text=text.replace(old,new,1)

          old_head='''  <div class="retirement-simulation-head">\n    <p class="section-kicker">Cenários</p>\n    <h2 id="retirementSimulationTitle">Simulação de aposentadoria</h2>\n  </div>\n  <div class="retirement-simulation-grid">'''
          new_head='''  <div class="retirement-simulation-head">\n    <p class="section-kicker">Cenários</p>\n    <h2 id="retirementSimulationTitle">Simulação de aposentadoria</h2>\n  </div>\n  <div class="retirement-simulation-controls">\n    <div class="retirement-simulation-control retirement-simulation-capital">\n      <div class="retirement-simulation-capital-main"><span>Hoje você tem:</span><strong id="retirementSimulationCapitalValue">R$ 0,00</strong><button id="editRetirementSimulationCapital" class="retirement-simulation-edit" type="button" aria-label="Editar valor atual da aposentadoria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m14.5 6.5 3 3"/></svg></button></div>\n      <label class="retirement-simulation-auto"><input id="retirementSimulationAuto" type="checkbox"><span>Adicionar automaticamente</span></label>\n    </div>\n    <label class="retirement-simulation-control retirement-simulation-years"><span>Quero me aposentar daqui a</span><span class="retirement-simulation-years-field"><input id="retirementSimulationYears" type="number" inputmode="numeric" min="1" max="100" step="1" placeholder="XX" aria-label="Anos até a aposentadoria"><span>anos</span></span></label>\n  </div>\n  <div class="retirement-simulation-grid">'''
          rep(old_head,new_head,'simulation controls HTML')

          retirement_sheet='<div id="retirementSheet" class="sheet hidden">'
          capital_sheet='''<div id="retirementSimulationCapitalSheet" class="sheet hidden" aria-hidden="true"><div class="sheet-card"><button type="button" id="retirementSimulationCapitalSheetClose" class="sheet-close" aria-label="Fechar">×</button><p class="eyebrow">Simulação de aposentadoria</p><h2>Editar valor atual</h2><p class="sheet-copy">Informe quanto você quer considerar como valor inicial da aposentadoria.</p><div class="field"><label for="retirementSimulationCapitalInput">Valor atual</label><input id="retirementSimulationCapitalInput" type="text" inputmode="decimal" placeholder="R$ 0,00"></div><div class="sheet-actions"><button type="button" id="saveRetirementSimulationCapital" class="btn primary full">Salvar valor</button><button type="button" id="cancelRetirementSimulationCapital" class="btn secondary full">Cancelar</button></div></div></div>\n'''+retirement_sheet
          rep(retirement_sheet,capital_sheet,'capital sheet')

          css='''\n/* Retirement simulation inputs */\n.retirement-simulation-controls{display:grid;gap:10px;margin-bottom:18px}\n.retirement-simulation-control{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.58);color:var(--txt)}\n.retirement-simulation-capital-main{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.retirement-simulation-capital-main>span,.retirement-simulation-years>span:first-child{color:var(--mut);font-size:.78rem;font-weight:600}\n.retirement-simulation-capital-main strong{font-size:1rem;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums}\n.retirement-simulation-edit{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;padding:0;border:0;border-radius:8px;background:transparent;color:var(--green);cursor:pointer}\n.retirement-simulation-edit:hover{background:#137a520d}\n.retirement-simulation-edit:disabled{cursor:default;opacity:.32;background:transparent}\n.retirement-simulation-edit svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}\n.retirement-simulation-auto{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:#46534c;font-size:.73rem;font-weight:600;cursor:pointer}\n.retirement-simulation-auto input{appearance:none;width:18px;height:18px;min-height:18px;display:grid;place-items:center;padding:0;border:1px solid #17201b38;border-radius:5px;background:#fff;cursor:pointer}\n.retirement-simulation-auto input:checked{border-color:var(--green);background:var(--green)}\n.retirement-simulation-auto input:checked::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}\n.retirement-simulation-years{justify-content:flex-start}\n.retirement-simulation-years-field{display:inline-flex;align-items:center;gap:7px}\n.retirement-simulation-years-field input{width:72px;min-height:38px;padding:0 10px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}\n.retirement-simulation-years-field>span{color:var(--txt);font-size:.78rem;font-weight:600}\n@media(min-width:761px){\n  .retirement-simulation-controls{grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:16px;margin-bottom:22px}\n  .retirement-simulation-control{min-height:76px;padding:17px 18px;border-color:#17201b17;border-radius:13px;background:#fff}\n  .retirement-simulation-capital-main>span,.retirement-simulation-years>span:first-child{font-size:.82rem}\n  .retirement-simulation-capital-main strong{font-size:1.15rem}\n}\n@media(max-width:620px){\n  .retirement-simulation-capital{align-items:flex-start;flex-direction:column}\n  .retirement-simulation-auto{padding-top:2px}\n  .retirement-simulation-years{align-items:flex-start;flex-direction:column;gap:9px}\n}\n'''
          rep('</style>',css+'</style>','simulation inputs CSS')

          state_old='categoryCreationOrigin="settings",projectionTarget=0;let currentUser=null'
          state_new='categoryCreationOrigin="settings",projectionTarget=0,retirementSimulationCapital=0,retirementSimulationAuto=false,retirementSimulationYears=0;let currentUser=null'
          rep(state_old,state_new,'state variables')

          helper_old='function saveProjectionTargetLocal(uid=currentUser?.uid){if(!uid)return;if(projectionTarget>0)localStorage.setItem(projectionTargetKey(uid),String(projectionTarget));else localStorage.removeItem(projectionTargetKey(uid))}'
          helper_new=helper_old+'const retirementSimulationKey=uid=>`patrimonio-retirement-simulation-${uid||"anonymous"}`;function cleanRetirementSimulation(value){let raw=value&&typeof value==="object"?value:{},capital=Math.max(0,Number(raw.capital)||0),years=Math.max(0,Math.min(100,Math.round(Number(raw.years)||0)));return{capital,auto:!!raw.auto,years}}function loadRetirementSimulation(uid){try{return cleanRetirementSimulation(JSON.parse(localStorage.getItem(retirementSimulationKey(uid))||"{}"))}catch{return cleanRetirementSimulation({})}}function applyRetirementSimulation(value){let clean=cleanRetirementSimulation(value);retirementSimulationCapital=clean.capital;retirementSimulationAuto=clean.auto;retirementSimulationYears=clean.years}function saveRetirementSimulationLocal(uid=currentUser?.uid){if(!uid)return;localStorage.setItem(retirementSimulationKey(uid),JSON.stringify(cleanRetirementSimulation({capital:retirementSimulationCapital,auto:retirementSimulationAuto,years:retirementSimulationYears})))}'
          rep(helper_old,helper_new,'storage helpers')

          el_old='retirementValue:$("#retirementValue"),retirementBase:$("#retirementBase")'
          el_new='retirementValue:$("#retirementValue"),retirementSimulationCapitalValue:$("#retirementSimulationCapitalValue"),retirementSimulationAuto:$("#retirementSimulationAuto"),retirementSimulationYears:$("#retirementSimulationYears"),retirementSimulationCapitalSheet:$("#retirementSimulationCapitalSheet"),retirementSimulationCapitalInput:$("#retirementSimulationCapitalInput"),retirementBase:$("#retirementBase")'
          rep(el_old,el_new,'element refs')

          payload_old='function cloudPayload(version=Date.now()){return{formatVersion:6,clientUpdatedAt:version,updatedAt:serverTimestamp(),projectionTarget:cleanProjectionTarget(projectionTarget),categories:[...categories],pendingContributions:cleanPendingContributions(pendingContributions),closings:ordered()}}'
          payload_new='function cloudPayload(version=Date.now()){return{formatVersion:7,clientUpdatedAt:version,updatedAt:serverTimestamp(),projectionTarget:cleanProjectionTarget(projectionTarget),retirementSimulation:cleanRetirementSimulation({capital:retirementSimulationCapital,auto:retirementSimulationAuto,years:retirementSimulationYears}),categories:[...categories],pendingContributions:cleanPendingContributions(pendingContributions),closings:ordered()}}'
          rep(payload_old,payload_new,'cloud payload')

          start_old='async function startCloudSync(user){unsubscribeCloud?.();currentUser=user;projectionTarget=loadProjectionTarget(user.uid);updateUserIdentity(user);'
          start_new='async function startCloudSync(user){unsubscribeCloud?.();currentUser=user;projectionTarget=loadProjectionTarget(user.uid);applyRetirementSimulation(loadRetirementSimulation(user.uid));updateUserIdentity(user);'
          rep(start_old,start_new,'load local simulation')

          first_remote_old='if(Object.prototype.hasOwnProperty.call(data,"projectionTarget"))projectionTarget=cleanProjectionTarget(data.projectionTarget);saveProjectionTargetLocal(user.uid);const remoteRaw='
          first_remote_new='if(Object.prototype.hasOwnProperty.call(data,"projectionTarget"))projectionTarget=cleanProjectionTarget(data.projectionTarget);saveProjectionTargetLocal(user.uid);if(Object.prototype.hasOwnProperty.call(data,"retirementSimulation"))applyRetirementSimulation(data.retirementSimulation);saveRetirementSimulationLocal(user.uid);const remoteRaw='
          rep(first_remote_old,first_remote_new,'first remote simulation')

          live_old='if(Object.prototype.hasOwnProperty.call(data,"projectionTarget")){projectionTarget=cleanProjectionTarget(data.projectionTarget);saveProjectionTargetLocal(user.uid);renderProjections()}if(version&&version===lastPushedVersion)'
          live_new='if(Object.prototype.hasOwnProperty.call(data,"projectionTarget")){projectionTarget=cleanProjectionTarget(data.projectionTarget);saveProjectionTargetLocal(user.uid);renderProjections()}if(Object.prototype.hasOwnProperty.call(data,"retirementSimulation")){applyRetirementSimulation(data.retirementSimulation);saveRetirementSimulationLocal(user.uid);renderProjections()}if(version&&version===lastPushedVersion)'
          rep(live_old,live_new,'live simulation sync')

          render_old='function renderWealthSplit(last){let hasBaseCategory=categories.includes(RETIREMENT_CATEGORY),base=hasBaseCategory?catValue(last,RETIREMENT_CATEGORY):0,cdb=Math.max(0,Number(last?.retirementCdb)||0),retirement=base+cdb,myMoney=last.total-retirement,combined=retirement+myMoney,mismatch=Math.abs(combined-last.total)>.01;el.retirementBaseLabel.textContent=hasBaseCategory?RETIREMENT_CATEGORY:"Investimentos de aposentadoria";el.retirementBase.textContent=brl(base);el.retirementCdbValue.textContent=brl(cdb);el.retirementValue.textContent=brl(retirement);el.myMoneyValue.textContent=brl(myMoney);el.wealthSplitTotal.textContent=brl(combined);el.wealthSplitWarning.classList.toggle("hidden",!mismatch)}'
          render_new='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}\nfunction renderWealthSplit(last){let hasBaseCategory=categories.includes(RETIREMENT_CATEGORY),base=hasBaseCategory?catValue(last,RETIREMENT_CATEGORY):0,cdb=Math.max(0,Number(last?.retirementCdb)||0),retirement=base+cdb,myMoney=last.total-retirement,combined=retirement+myMoney,mismatch=Math.abs(combined-last.total)>.01;el.retirementBaseLabel.textContent=hasBaseCategory?RETIREMENT_CATEGORY:"Investimentos de aposentadoria";el.retirementBase.textContent=brl(base);el.retirementCdbValue.textContent=brl(cdb);el.retirementValue.textContent=brl(retirement);el.myMoneyValue.textContent=brl(myMoney);el.wealthSplitTotal.textContent=brl(combined);el.wealthSplitWarning.classList.toggle("hidden",!mismatch);renderRetirementSimulation(retirement)}'
          rep(render_old,render_new,'render simulation')

          funcs_marker='function openRetirementSheet(){'
          funcs='''function openRetirementSimulationCapitalSheet(){if(retirementSimulationAuto)return;el.retirementSimulationCapitalInput.value=retirementSimulationCapital?retirementSimulationCapital.toFixed(2).replace(".",","):"";el.retirementSimulationCapitalSheet.classList.remove("hidden");el.retirementSimulationCapitalSheet.setAttribute("aria-hidden","false");setTimeout(()=>el.retirementSimulationCapitalInput.focus(),50)}\nfunction closeRetirementSimulationCapitalSheet(){el.retirementSimulationCapitalSheet.classList.add("hidden");el.retirementSimulationCapitalSheet.setAttribute("aria-hidden","true")}\nasync function saveRetirementSimulationCapital(){let value=parse(el.retirementSimulationCapitalInput.value);if(value<0)return toast("Informe um valor válido.");retirementSimulationCapital=value;saveRetirementSimulationLocal();closeRetirementSimulationCapitalSheet();renderProjections();queueCloudSync();toast("Valor da aposentadoria atualizado.")}\nfunction saveRetirementSimulationYears(){let raw=String(el.retirementSimulationYears.value||"").trim();retirementSimulationYears=raw?Math.max(1,Math.min(100,Math.round(Number(raw)||0))):0;el.retirementSimulationYears.value=retirementSimulationYears||"";saveRetirementSimulationLocal();queueCloudSync()}\nfunction toggleRetirementSimulationAuto(){retirementSimulationAuto=el.retirementSimulationAuto.checked;saveRetirementSimulationLocal();renderProjections();queueCloudSync()}\n'''+funcs_marker
          rep(funcs_marker,funcs,'simulation functions')

          events_old='$("#addRetirementCdb").onclick=openRetirementSheet;'
          events_new='$("#editRetirementSimulationCapital").onclick=openRetirementSimulationCapitalSheet;$("#retirementSimulationCapitalSheetClose").onclick=closeRetirementSimulationCapitalSheet;$("#cancelRetirementSimulationCapital").onclick=closeRetirementSimulationCapitalSheet;$("#saveRetirementSimulationCapital").onclick=saveRetirementSimulationCapital;el.retirementSimulationCapitalSheet.onclick=e=>{if(e.target===el.retirementSimulationCapitalSheet)closeRetirementSimulationCapitalSheet()};el.retirementSimulationCapitalInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();saveRetirementSimulationCapital()}});el.retirementSimulationAuto.onchange=toggleRetirementSimulationAuto;el.retirementSimulationYears.onchange=saveRetirementSimulationYears;'+events_old
          rep(events_old,events_new,'simulation events')

          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add retirement simulation inputs"
          git push origin main
