name: Inspect closing date flow
on:
  push:
    paths:
      - '.github/workflows/inspect-month-flow.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant index snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['getElementById("month")','getElementById(\'month\')','reviewMonth','month.value','el.month','updatedAt','closing','save.addEventListener','id="month"']
          seen=[]
          for term in terms:
              start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  if all(abs(i-j)>1200 for j in seen):
                      seen.append(i)
                      a=max(0,i-1200); b=min(len(s),i+2200)
                      print('\n--- TERM',term,'AT',i,'---\n')
                      print(s[a:b].replace('\n','\\n'))
                  start=i+1
          print('\nTOTAL SNIPPETS',len(seen))
          PY
