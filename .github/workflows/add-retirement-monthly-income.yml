name: Retirement monthly income

on:
  push:
    paths:
      - '.github/workflows/add-retirement-monthly-income.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add retirement monthly income
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          def rep(old,new,label):
              global text
              count=text.count(old)
              if count!=1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text=text.replace(old,new,1)

          rep(
            '<strong id="retirementSimulationConservativeValue" class="retirement-simulation-result">—</strong></article>',
            '<strong id="retirementSimulationConservativeValue" class="retirement-simulation-result">—</strong><p class="retirement-simulation-income">Vivendo de rendimentos, você tiraria uns: <strong id="retirementSimulationConservativeIncome">—</strong></p></article>',
            'conservative income'
          )
          rep(
            '<strong id="retirementSimulationModerateValue" class="retirement-simulation-result">—</strong></article>',
            '<strong id="retirementSimulationModerateValue" class="retirement-simulation-result">—</strong><p class="retirement-simulation-income">Vivendo de rendimentos, você tiraria uns: <strong id="retirementSimulationModerateIncome">—</strong></p></article>',
            'moderate income'
          )
          rep(
            '<strong id="retirementSimulationOptimisticValue" class="retirement-simulation-result">—</strong></article>',
            '<strong id="retirementSimulationOptimisticValue" class="retirement-simulation-result">—</strong><p class="retirement-simulation-income">Vivendo de rendimentos, você tiraria uns: <strong id="retirementSimulationOptimisticIncome">—</strong></p></article>',
            'optimistic income'
          )

          css='''\n/* Retirement simulation monthly income */\n.retirement-simulation-income{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line);color:var(--mut);font-size:.62rem;line-height:1.45}\n.retirement-simulation-income strong{color:var(--txt);font-weight:650;font-variant-numeric:tabular-nums}\n@media(min-width:761px){.retirement-simulation-income{font-size:.68rem}}\n'''
          rep('</style>',css+'</style>','monthly income CSS')

          el_old='retirementSimulationOptimisticValue:$("#retirementSimulationOptimisticValue"),retirementSimulationAuto:$("#retirementSimulationAuto")'
          el_new='retirementSimulationOptimisticValue:$("#retirementSimulationOptimisticValue"),retirementSimulationConservativeIncome:$("#retirementSimulationConservativeIncome"),retirementSimulationModerateIncome:$("#retirementSimulationModerateIncome"),retirementSimulationOptimisticIncome:$("#retirementSimulationOptimisticIncome"),retirementSimulationAuto:$("#retirementSimulationAuto")'
          rep(el_old,el_new,'monthly income element refs')

          render_old='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital,years=retirementSimulationYears>0?retirementSimulationYears:0;let future=years?value*Math.pow(1.006,years*12):null,conservative=years?value*Math.pow((1+0.06)/(1+0.056),years):null,moderate=years?value*Math.pow((1+0.08)/(1+0.056),years):null,optimistic=years?value*Math.pow((1+0.1066)/(1+0.056),years):null;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationFutureValue.textContent=future===null?"—":brl(future);el.retirementSimulationConservativeValue.textContent=conservative===null?"—":brl(conservative);el.retirementSimulationModerateValue.textContent=moderate===null?"—":brl(moderate);el.retirementSimulationOptimisticValue.textContent=optimistic===null?"—":brl(optimistic);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          render_new='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital,years=retirementSimulationYears>0?retirementSimulationYears:0;let future=years?value*Math.pow(1.006,years*12):null,conservative=years?value*Math.pow((1+0.06)/(1+0.056),years):null,moderate=years?value*Math.pow((1+0.08)/(1+0.056),years):null,optimistic=years?value*Math.pow((1+0.1066)/(1+0.056),years):null,conservativeIncome=conservative===null?null:conservative*.008,moderateIncome=moderate===null?null:moderate*.008,optimisticIncome=optimistic===null?null:optimistic*.008;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationFutureValue.textContent=future===null?"—":brl(future);el.retirementSimulationConservativeValue.textContent=conservative===null?"—":brl(conservative);el.retirementSimulationModerateValue.textContent=moderate===null?"—":brl(moderate);el.retirementSimulationOptimisticValue.textContent=optimistic===null?"—":brl(optimistic);el.retirementSimulationConservativeIncome.textContent=conservativeIncome===null?"—":brl(conservativeIncome);el.retirementSimulationModerateIncome.textContent=moderateIncome===null?"—":brl(moderateIncome);el.retirementSimulationOptimisticIncome.textContent=optimisticIncome===null?"—":brl(optimisticIncome);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          rep(render_old,render_new,'monthly income calculation')

          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add retirement monthly income estimates"
          git push origin main
