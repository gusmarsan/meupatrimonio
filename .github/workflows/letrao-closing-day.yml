name: Letrao closing day
on:
  push:
    paths:
      - '.github/workflows/letrao-closing-day.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add full closing date to Modo Letrao
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')

          if "meu-patrimonio-pwa-v25" not in s:
              raise SystemExit('Expected cache v25 not found')
          s=s.replace("meu-patrimonio-pwa-v25","meu-patrimonio-pwa-v26",1)

          css_anchor='  body.letrao-mode #new{max-width:880px}\n'
          css_add='  body.letrao-mode #new .letrao-original-month-field{display:none!important}\n  body.letrao-mode #new #letraoClosingDateField{display:grid}\n'
          if css_anchor not in s:
              raise SystemExit('Expected Letrao new view style anchor not found')
          if 'letrao-original-month-field' not in s:
              s=s.replace(css_anchor,css_anchor+css_add,1)

          ref_anchor="  const printInput=document.getElementById('files');\n"
          ref_add="  const monthInput=document.getElementById('month');\n  const monthField=monthInput?.closest('.field');\n"
          if ref_anchor not in s:
              raise SystemExit('Expected print input reference not found')
          if "const monthInput=document.getElementById('month');" not in s:
              s=s.replace(ref_anchor,ref_anchor+ref_add,1)

          aux_anchor="  const allocationCurrentLabel=document.querySelector('#home .allocation-panel .section-heading>.small');\n"
          aux_add=(
              "  const reviewDateCaption=document.querySelector('#review .monthline span');\n"
              "  const reviewDateValue=document.getElementById('reviewMonth');\n"
              "  let closingDateField=document.getElementById('letraoClosingDateField');\n"
              "  if(!closingDateField&&monthField){closingDateField=document.createElement('div');closingDateField.id='letraoClosingDateField';closingDateField.className='field';const dateLabel=document.createElement('label');dateLabel.htmlFor='letraoClosingDate';dateLabel.textContent='Dia do fechamento';const dateInput=document.createElement('input');dateInput.id='letraoClosingDate';dateInput.type='date';closingDateField.append(dateLabel,dateInput);monthField.after(closingDateField)}\n"
              "  const closingDateInput=document.getElementById('letraoClosingDate');\n"
              "  if(closingDateField)closingDateField.hidden=true;\n"
              "  const formatClosingDate=value=>{const parts=String(value||'').split('-');return parts.length===3?`${parts[2]}/${parts[1]}/${parts[0]}`:''};\n"
              "  const syncReviewDate=()=>{if(document.body.classList.contains('letrao-mode')&&closingDateInput?.value&&reviewDateValue){const formatted=formatClosingDate(closingDateInput.value);if(formatted&&reviewDateValue.textContent!==formatted)reviewDateValue.textContent=formatted}};\n"
              "  const updateManualReady=()=>{if(!manualButton)return;if(document.body.classList.contains('letrao-mode'))manualButton.disabled=!closingDateInput?.value;else manualButton.disabled=false};\n"
              "  closingDateInput?.addEventListener('change',()=>{if(closingDateInput.value&&monthInput){monthInput.value=closingDateInput.value.slice(0,7);monthInput.dispatchEvent(new Event('change',{bubbles:true}))}updateManualReady();syncReviewDate()});\n"
              "  if(reviewDateValue)new MutationObserver(syncReviewDate).observe(reviewDateValue,{childList:true,characterData:true,subtree:true});\n"
              "  document.addEventListener('click',event=>{if(!document.body.classList.contains('letrao-mode'))return;if(event.target.closest?.('#homeNew,#newTop,#homeFirstClosing')){if(closingDateInput)closingDateInput.value='';updateManualReady()}},true);\n"
          )
          if aux_anchor not in s:
              raise SystemExit('Expected allocation label reference not found')
          if "const reviewDateCaption=" not in s:
              s=s.replace(aux_anchor,aux_anchor+aux_add,1)

          labels_anchor="    if(allocationCurrentLabel)allocationCurrentLabel.textContent=simple?'Divisão atual':'Participação atual';\n"
          labels_add="    if(reviewDateCaption)reviewDateCaption.textContent=simple?'Dia do fechamento':'Mês do fechamento';\n"
          if labels_anchor not in s:
              raise SystemExit('Expected labels anchor not found')
          if "reviewDateCaption.textContent" not in s:
              s=s.replace(labels_anchor,labels_anchor+labels_add,1)

          apply_anchor="    if(printInput)printInput.disabled=active;\n"
          apply_add="    if(monthField)monthField.classList.toggle('letrao-original-month-field',active);\n    if(closingDateField)closingDateField.hidden=!active;\n    updateManualReady();\n    syncReviewDate();\n"
          if apply_anchor not in s:
              raise SystemExit('Expected apply anchor not found')
          if "closingDateField.hidden=!active" not in s:
              s=s.replace(apply_anchor,apply_anchor+apply_add,1)

          enhancer_anchor="  updated = updated.replace(\n    'function setContributionPanel(open){el.contributionPanel.classList.toggle(\"hidden\",!open);if(open){renderContributionControls();setTimeout(()=>el.contributionValue.focus(),30)}}',\n    'function setContributionPanel(open){const mobile=matchMedia(\"(max-width:760px)\").matches;if(open&&mobile&&el.contributionPanel.parentElement!==document.body)document.body.append(el.contributionPanel);if(!open&&el.contributionPanel.parentElement!==el.contributionWrap)el.contributionWrap.append(el.contributionPanel);el.contributionPanel.classList.toggle(\"hidden\",!open);document.body.classList.toggle(\"contribution-open\",open&&mobile);if(open){renderContributionControls();if(!mobile)setTimeout(()=>el.contributionValue.focus(),30)}}'\n  );\n"
          enhancer_add=(
              "\n  updated = updated.replace(\n"
              "    'retirementCdb,updatedAt:Number.isFinite(Number(c.updatedAt))?Number(c.updatedAt):Date.now()}}',\n"
              "    'retirementCdb,closingDate:typeof c.closingDate===\"string\"&&/^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$/.test(c.closingDate)&&c.closingDate.slice(0,7)===c.month?c.closingDate:\"\",updatedAt:Number.isFinite(Number(c.updatedAt))?Number(c.updatedAt):Date.now()}}'\n"
              "  );\n"
              "\n  updated = updated.replace(\n"
              "    'c={id:editing||mid(),month,total,entries,contributions,retirementCdb,updatedAt:Date.now()};',\n"
              "    'c={id:editing||mid(),month,total,entries,contributions,retirementCdb,closingDate:(document.body.classList.contains(\"letrao-mode\")&&document.getElementById(\"letraoClosingDate\")?.value)||original?.closingDate||dup?.closingDate||\"\",updatedAt:Date.now()};'\n"
              "  );\n"
          )
          if enhancer_anchor not in s:
              raise SystemExit('Expected enhancer contribution transform not found')
          if "closingDate:typeof c.closingDate" not in s:
              s=s.replace(enhancer_anchor,enhancer_anchor+enhancer_add,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Add closing day picker to Modo Letrao"
          git push
