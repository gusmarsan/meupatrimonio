name: Letrao help steps
on:
  push:
    paths:
      - '.github/workflows/letrao-help-steps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add help steps
        run: python .github/scripts/letrao_help_steps.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Add simple help steps to Modo Letrao"
          git push
