name: Add TD real placeholders
on:
  push:
    paths:
      - '.github/workflows/add-td-real-placeholders.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/add_td_real_placeholders.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Add Tesouro Direto real-return placeholders"
          git push
