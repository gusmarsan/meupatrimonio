name: Retirement future value

on:
  push:
    paths:
      - '.github/workflows/add-retirement-future-value.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add retirement future value
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          def rep(old,new,label):
              global text
              count=text.count(old)
              if count!=1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text=text.replace(old,new,1)

          old_html='''      <div class="retirement-simulation-capital-main"><span>Hoje você tem:</span><strong id="retirementSimulationCapitalValue">R$ 0,00</strong><button id="editRetirementSimulationCapital" class="retirement-simulation-edit" type="button" aria-label="Editar valor atual da aposentadoria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m14.5 6.5 3 3"/></svg></button></div>\n      <label class="retirement-simulation-auto">'''
          new_html='''      <div class="retirement-simulation-capital-copy"><div class="retirement-simulation-capital-main"><span>Hoje você tem:</span><strong id="retirementSimulationCapitalValue">R$ 0,00</strong><button id="editRetirementSimulationCapital" class="retirement-simulation-edit" type="button" aria-label="Editar valor atual da aposentadoria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m14.5 6.5 3 3"/></svg></button></div><p class="retirement-simulation-growth">Se você não aplicar mais nada, deve ter <strong id="retirementSimulationFutureValue">—</strong> quando se aposentar.</p></div>\n      <label class="retirement-simulation-auto">'''
          rep(old_html,new_html,'future value HTML')

          css='''\n.retirement-simulation-capital-copy{min-width:0;display:grid;gap:5px}\n.retirement-simulation-growth{margin:0;color:var(--mut);font-size:.68rem;line-height:1.45}\n.retirement-simulation-growth strong{color:var(--txt);font-weight:650;font-variant-numeric:tabular-nums}\n@media(min-width:761px){.retirement-simulation-growth{font-size:.72rem}}\n'''
          rep('</style>',css+'</style>','future value CSS')

          el_old='retirementSimulationCapitalValue:$("#retirementSimulationCapitalValue"),retirementSimulationAuto:$("#retirementSimulationAuto")'
          el_new='retirementSimulationCapitalValue:$("#retirementSimulationCapitalValue"),retirementSimulationFutureValue:$("#retirementSimulationFutureValue"),retirementSimulationAuto:$("#retirementSimulationAuto")'
          rep(el_old,el_new,'future value element ref')

          render_old='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          render_new='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital;let future=retirementSimulationYears>0?value*Math.pow(1.006,retirementSimulationYears*12):null;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationFutureValue.textContent=future===null?"—":brl(future);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          rep(render_old,render_new,'future value calculation')

          years_old='function saveRetirementSimulationYears(){let raw=String(el.retirementSimulationYears.value||"").trim();retirementSimulationYears=raw?Math.max(1,Math.min(100,Math.round(Number(raw)||0))):0;el.retirementSimulationYears.value=retirementSimulationYears||"";saveRetirementSimulationLocal();queueCloudSync()}'
          years_new='function saveRetirementSimulationYears(){let raw=String(el.retirementSimulationYears.value||"").trim();retirementSimulationYears=raw?Math.max(1,Math.min(100,Math.round(Number(raw)||0))):0;el.retirementSimulationYears.value=retirementSimulationYears||"";saveRetirementSimulationLocal();renderProjections();queueCloudSync()}'
          rep(years_old,years_new,'years rerender')

          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add retirement future value projection"
          git push origin main
