name: Move TD real values to Projections
on:
  push:
    paths:
      - '.github/workflows/move-td-real-to-projections.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/move_td_real_to_projections.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Move Tesouro Direto real values to Projections"
          git push
