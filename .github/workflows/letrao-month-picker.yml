name: Letrao month-only picker
on:
  push:
    paths:
      - '.github/workflows/letrao-month-picker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add month-only picker for Modo Letrao
        run: python .github/scripts/letrao_month_picker.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Use month-only picker in Modo Letrao"
          git push
