name: Real Letrao help route
on:
  push:
    paths:
      - '.github/workflows/real-letrao-help-route.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create independent Duvidas route
        run: |
          python - <<'PY'
          from pathlib import Path

          idx=Path('index.html')
          html=idx.read_text(encoding='utf-8')

          css='''\n/* Letrao help route */\n.letrao-help-nav{display:none!important}\n@media(min-width:761px){\n  body.letrao-mode nav .nav[data-view="new"]{display:none!important}\n  body.letrao-mode nav .letrao-help-nav{display:flex!important;order:5;margin-top:auto;border:1px solid #ffffff1f}\n  body.letrao-mode #letraoHelp{min-height:calc(100vh - 112px);padding:0!important;background:transparent!important}\n}\n'''
          if '/* Letrao help route */' not in html:
              if '</style>' not in html:
                  raise SystemExit('style closing tag not found')
              html=html.replace('</style>',css+'</style>',1)

          if 'id="letraoHelp"' not in html:
              if '</main>' not in html:
                  raise SystemExit('main closing tag not found')
              html=html.replace('</main>','<section id="letraoHelp" class="view" aria-label="Dúvidas"></section>\n</main>',1)

          if 'class="nav letrao-help-nav"' not in html:
              help_button='<button type="button" class="nav letrao-help-nav" data-view="letraoHelp"><span aria-hidden="true">＋</span><small>Dúvidas</small></button>'
              if '</nav>' not in html:
                  raise SystemExit('nav closing tag not found')
              html=html.replace('</nav>',help_button+'</nav>',1)

          old='projections:"Projeções"}[id]'
          new='projections:"Projeções",letraoHelp:"Veja o passo a passo"}[id]'
          if old in html:
              html=html.replace(old,new,1)
          elif new not in html:
              raise SystemExit('view title mapping not found')

          html=html.replace("./sw.js?v=29","./sw.js?v=30",1)
          idx.write_text(html,encoding='utf-8')

          sw=Path('sw.js')
          s=sw.read_text(encoding='utf-8')
          if "meu-patrimonio-pwa-v29" in s:
              s=s.replace("meu-patrimonio-pwa-v29","meu-patrimonio-pwa-v30",1)
          elif "meu-patrimonio-pwa-v30" not in s:
              raise SystemExit('expected cache v29 not found')
          old_exit="if(!active&&(document.body.dataset.view||'')==='letrao-help')homeNav?.click();"
          new_exit="if(!active&&['letrao-help','letraoHelp'].includes(document.body.dataset.view||''))homeNav?.click();"
          if old_exit in s:
              s=s.replace(old_exit,new_exit,1)
          sw.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Create independent Modo Letrao Duvidas route"
          git push
