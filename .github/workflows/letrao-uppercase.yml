name: Letrao uppercase controls
on:
  push:
    paths:
      - '.github/workflows/letrao-uppercase.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uppercase Letrao buttons and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')

          if "meu-patrimonio-pwa-v22" not in s:
              raise SystemExit('Expected cache v22 not found')
          s = s.replace("meu-patrimonio-pwa-v22", "meu-patrimonio-pwa-v23", 1)

          anchor = '  body.letrao-mode .letrao-toggle{min-height:48px;padding:0 17px;font-size:.9rem;border-width:2px}\n'
          addition = '  body.letrao-mode button,\n  body.letrao-mode nav .nav small{text-transform:uppercase}\n'
          if anchor not in s:
              raise SystemExit('Expected Letrao style anchor not found')
          if 'body.letrao-mode nav .nav small{text-transform:uppercase}' not in s:
              s = s.replace(anchor, anchor + addition, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Uppercase Letrao buttons and navigation"
          git push
