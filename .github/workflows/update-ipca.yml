name: Atualizar IPCA oficial
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Atualizar IPCA do Banco Central
        run: python .github/scripts/update-ipca.py
      - name: Publicar índices novos
        run: |
          if git diff --quiet -- ipca-data.json; then
            echo "IPCA sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipca-data.json
          git commit -m "Update official monthly IPCA data"
          git push
