name: Auto calculate TD 2029
on:
  push:
    paths:
      - '.github/workflows/auto-td2029.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/auto_td2029.py
      - name: Test JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          module=html.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path("/tmp/meupatrimonio-main.mjs").write_text(module)
          assert 'tdReal2029Input' not in html
          assert 'id="tdReal2029Value"' in html
          assert 'R$ xx.xxx,xx' not in html
          PY
          node --check /tmp/meupatrimonio-main.mjs
          node --check sw.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Calculate TD 2029 theoretical net value on app open"
          git push

# Retry with service worker syntax fix
