name: Fix Letrao date and help
on:
  push:
    paths:
      - '.github/workflows/fix-letrao-date-help.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_letrao_date_help.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Use daily date picker in Modo Letrao"
          git push
