name: Letrao blank help page
on:
  push:
    paths:
      - '.github/workflows/letrao-help-blank-page.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Dúvidas open a blank help page
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')

          if "meu-patrimonio-pwa-v26" not in s:
              raise SystemExit('Expected cache v26 not found')
          s=s.replace("meu-patrimonio-pwa-v26","meu-patrimonio-pwa-v27",1)

          css_anchor='  body.letrao-mode #evolution .hrow{min-height:96px}\n'
          css_add='  body.letrao-mode #letraoHelp{min-height:calc(100vh - 120px);margin:0;padding:0;background:transparent}\n'
          if css_anchor not in s:
              raise SystemExit('Expected Letrao style anchor not found')
          if 'body.letrao-mode #letraoHelp{' not in s:
              s=s.replace(css_anchor,css_anchor+css_add,1)

          old="  const openHelp=()=>{if(!helpView||!navNewButton)return;document.body.dataset.view='letrao-help';document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view===helpView));document.querySelectorAll('.nav').forEach(nav=>nav.classList.toggle('active',nav===navNewButton));if(titleElement)titleElement.textContent='Dúvidas';scrollTo({top:0,behavior:'instant'})};\n  const originalNavNewClick=navNewButton?.onclick;\n  if(navNewButton)navNewButton.onclick=event=>{if(document.body.classList.contains('letrao-mode')){event?.preventDefault();openHelp();return}originalNavNewClick?.call(navNewButton,event)};\n"
          new="  const openHelp=()=>{if(!helpView||!navNewButton)return;helpView.replaceChildren();document.body.dataset.view='letrao-help';document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view===helpView));document.querySelectorAll('.nav').forEach(nav=>nav.classList.toggle('active',nav===navNewButton));if(titleElement)titleElement.textContent='Veja o passo a passo';scrollTo({top:0,behavior:'instant'})};\n  if(navNewButton)navNewButton.addEventListener('click',event=>{if(!document.body.classList.contains('letrao-mode'))return;event.preventDefault();event.stopImmediatePropagation();openHelp()},true);\n"
          if old not in s:
              raise SystemExit('Expected Dúvidas routing block not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Make Modo Letrao Dúvidas open blank help page"
          git push
