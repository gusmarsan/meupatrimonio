name: Restore simplified Letrao projections
on:
  push:
    paths:
      - '.github/workflows/restore-letrao-projections.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only editable goal in Letrao projections
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')

          if "meu-patrimonio-pwa-v15" not in s:
              raise SystemExit('Expected cache v15 not found')
          s = s.replace("meu-patrimonio-pwa-v15", "meu-patrimonio-pwa-v16", 1)

          nav_hidden = '  body.letrao-mode .nav[data-view="projections"],\n'
          if nav_hidden not in s:
              raise SystemExit('Expected hidden projections nav selector not found')
          s = s.replace(nav_hidden, '', 1)

          anchor = '  body.letrao-mode #projections .projection-target:has(+ .wealth-split),\n'
          replacement = (
              '  body.letrao-mode #projections .projection-current,\n'
              '  body.letrao-mode #projections .projection-grid,\n'
              '  body.letrao-mode #projections .projection-note,\n'
              + anchor
          )
          if anchor not in s:
              raise SystemExit('Expected projections hidden block anchor not found')
          s = s.replace(anchor, replacement, 1)

          old_redirect = "    if(active&&['settings','projections'].includes(document.body.dataset.view||''))homeNav?.click();\n"
          new_redirect = "    if(active&&(document.body.dataset.view||'')==='settings')homeNav?.click();\n"
          if old_redirect not in s:
              raise SystemExit('Expected Letrao redirect rule not found')
          s = s.replace(old_redirect, new_redirect, 1)

          target_style_anchor = '  body.letrao-mode #evolution{max-width:1050px}\n'
          target_styles = (
              '  body.letrao-mode #projections{max-width:900px}\n'
              '  body.letrao-mode #projections .projection-target-row{margin-top:34px;padding:30px 32px;border:1px solid #17201b20;border-radius:14px;background:#fff;align-items:center}\n'
              '  body.letrao-mode #projections .projection-target{margin:0;font-size:2rem;line-height:1.2}\n'
              '  body.letrao-mode #projections .projection-target-edit{width:48px;height:48px;flex:0 0 48px}\n'
              '  body.letrao-mode #projections .projection-target-edit svg{width:22px;height:22px}\n'
          )
          if target_style_anchor not in s:
              raise SystemExit('Expected evolution style anchor not found')
          s = s.replace(target_style_anchor, target_styles + target_style_anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Restore simplified projections in Modo Letrao"
          git push
