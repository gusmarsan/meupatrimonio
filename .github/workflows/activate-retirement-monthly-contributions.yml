name: Activate retirement monthly contributions

on:
  push:
    paths:
      - '.github/workflows/activate-retirement-monthly-contributions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate monthly retirement contributions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          def rep(old,new,label):
              global text
              count=text.count(old)
              if count!=1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text=text.replace(old,new,1)

          rep(
            'projectionTarget=0,retirementSimulationCapital=0,retirementSimulationAuto=false,retirementSimulationYears=0;',
            'projectionTarget=0,retirementSimulationCapital=0,retirementSimulationAuto=false,retirementSimulationYears=0,retirementSimulationBoost=false,retirementSimulationMonthlyContribution=0;',
            'retirement simulation state'
          )

          old_clean='function cleanRetirementSimulation(value){let raw=value&&typeof value==="object"?value:{},capital=Math.max(0,Number(raw.capital)||0),years=Math.max(0,Math.min(100,Math.round(Number(raw.years)||0)));return{capital,auto:!!raw.auto,years}}function loadRetirementSimulation(uid){try{return cleanRetirementSimulation(JSON.parse(localStorage.getItem(retirementSimulationKey(uid))||"{}"))}catch{return cleanRetirementSimulation({})}}function applyRetirementSimulation(value){let clean=cleanRetirementSimulation(value);retirementSimulationCapital=clean.capital;retirementSimulationAuto=clean.auto;retirementSimulationYears=clean.years}function saveRetirementSimulationLocal(uid=currentUser?.uid){if(!uid)return;localStorage.setItem(retirementSimulationKey(uid),JSON.stringify(cleanRetirementSimulation({capital:retirementSimulationCapital,auto:retirementSimulationAuto,years:retirementSimulationYears})))}'
          new_clean='function cleanRetirementSimulation(value){let raw=value&&typeof value==="object"?value:{},capital=Math.max(0,Number(raw.capital)||0),years=Math.max(0,Math.min(100,Math.round(Number(raw.years)||0))),monthlyContribution=Math.max(0,Number(raw.monthlyContribution)||0);return{capital,auto:!!raw.auto,years,boost:!!raw.boost,monthlyContribution}}function loadRetirementSimulation(uid){try{return cleanRetirementSimulation(JSON.parse(localStorage.getItem(retirementSimulationKey(uid))||"{}"))}catch{return cleanRetirementSimulation({})}}function applyRetirementSimulation(value){let clean=cleanRetirementSimulation(value);retirementSimulationCapital=clean.capital;retirementSimulationAuto=clean.auto;retirementSimulationYears=clean.years;retirementSimulationBoost=clean.boost;retirementSimulationMonthlyContribution=clean.monthlyContribution}function saveRetirementSimulationLocal(uid=currentUser?.uid){if(!uid)return;localStorage.setItem(retirementSimulationKey(uid),JSON.stringify(cleanRetirementSimulation({capital:retirementSimulationCapital,auto:retirementSimulationAuto,years:retirementSimulationYears,boost:retirementSimulationBoost,monthlyContribution:retirementSimulationMonthlyContribution})))}'
          rep(old_clean,new_clean,'retirement simulation persistence')

          old_payload='function cloudPayload(version=Date.now()){return{formatVersion:7,clientUpdatedAt:version,updatedAt:serverTimestamp(),projectionTarget:cleanProjectionTarget(projectionTarget),retirementSimulation:cleanRetirementSimulation({capital:retirementSimulationCapital,auto:retirementSimulationAuto,years:retirementSimulationYears}),categories:[...categories],pendingContributions:cleanPendingContributions(pendingContributions),closings:ordered()}}'
          new_payload='function cloudPayload(version=Date.now()){return{formatVersion:8,clientUpdatedAt:version,updatedAt:serverTimestamp(),projectionTarget:cleanProjectionTarget(projectionTarget),retirementSimulation:cleanRetirementSimulation({capital:retirementSimulationCapital,auto:retirementSimulationAuto,years:retirementSimulationYears,boost:retirementSimulationBoost,monthlyContribution:retirementSimulationMonthlyContribution}),categories:[...categories],pendingContributions:cleanPendingContributions(pendingContributions),closings:ordered()}}'
          rep(old_payload,new_payload,'cloud payload')

          old_render='function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital,years=retirementSimulationYears>0?retirementSimulationYears:0;let future=years?value*Math.pow(1.006,years*12):null,conservative=years?value*Math.pow((1+0.06)/(1+0.056),years):null,moderate=years?value*Math.pow((1+0.08)/(1+0.056),years):null,optimistic=years?value*Math.pow((1+0.1066)/(1+0.056),years):null,conservativeIncome=conservative===null?null:conservative*.008,moderateIncome=moderate===null?null:moderate*.008,optimisticIncome=optimistic===null?null:optimistic*.008;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationFutureValue.textContent=future===null?"—":brl(future);el.retirementSimulationConservativeValue.textContent=conservative===null?"—":brl(conservative);el.retirementSimulationModerateValue.textContent=moderate===null?"—":brl(moderate);el.retirementSimulationOptimisticValue.textContent=optimistic===null?"—":brl(optimistic);el.retirementSimulationConservativeIncome.textContent=conservativeIncome===null?"—":brl(conservativeIncome);el.retirementSimulationModerateIncome.textContent=moderateIncome===null?"—":brl(moderateIncome);el.retirementSimulationOptimisticIncome.textContent=optimisticIncome===null?"—":brl(optimisticIncome);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          new_render='function retirementScenarioValue(value,years,nominalAnnual){let months=Math.max(0,Math.round(Number(years)||0)*12);if(!months)return null;let monthlyReturn=Math.pow(1+nominalAnnual,1/12)-1,monthlyInflation=Math.pow(1.056,1/12)-1,monthlyRealFactor=(1+monthlyReturn)/(1+monthlyInflation),monthlyContribution=retirementSimulationBoost?Math.max(0,retirementSimulationMonthlyContribution):0,balance=value;for(let month=0;month<months;month++){if(monthlyContribution>0)balance+=monthlyContribution;balance*=monthlyRealFactor}return balance}function renderRetirementSimulation(retirementTotal=0){let value=retirementSimulationAuto?Math.max(0,Number(retirementTotal)||0):retirementSimulationCapital,years=retirementSimulationYears>0?retirementSimulationYears:0;let future=years?value*Math.pow(1.006,years*12):null,conservative=years?retirementScenarioValue(value,years,.06):null,moderate=years?retirementScenarioValue(value,years,.08):null,optimistic=years?retirementScenarioValue(value,years,.1066):null,conservativeIncome=conservative===null?null:conservative*.008,moderateIncome=moderate===null?null:moderate*.008,optimisticIncome=optimistic===null?null:optimistic*.008;el.retirementSimulationCapitalValue.textContent=brl(value);el.retirementSimulationFutureValue.textContent=future===null?"—":brl(future);el.retirementSimulationConservativeValue.textContent=conservative===null?"—":brl(conservative);el.retirementSimulationModerateValue.textContent=moderate===null?"—":brl(moderate);el.retirementSimulationOptimisticValue.textContent=optimistic===null?"—":brl(optimistic);el.retirementSimulationConservativeIncome.textContent=conservativeIncome===null?"—":brl(conservativeIncome);el.retirementSimulationModerateIncome.textContent=moderateIncome===null?"—":brl(moderateIncome);el.retirementSimulationOptimisticIncome.textContent=optimisticIncome===null?"—":brl(optimisticIncome);el.retirementSimulationAuto.checked=retirementSimulationAuto;el.retirementSimulationYears.value=retirementSimulationYears||"";let boost=$("#retirementSimulationBoost"),boostField=$("#retirementSimulationBoostField"),monthlyInput=$("#retirementSimulationMonthlyContribution");boost.checked=retirementSimulationBoost;boost.setAttribute("aria-expanded",String(retirementSimulationBoost));boostField.classList.toggle("hidden",!retirementSimulationBoost);if(document.activeElement!==monthlyInput)monthlyInput.value=retirementSimulationMonthlyContribution?String(retirementSimulationMonthlyContribution).replace(".",","):"";$("#editRetirementSimulationCapital").disabled=retirementSimulationAuto;$("#editRetirementSimulationCapital").setAttribute("aria-disabled",String(retirementSimulationAuto))}'
          rep(old_render,new_render,'monthly scenario calculations')

          old_events='$("#retirementSimulationBoost").onchange=e=>{let field=$("#retirementSimulationBoostField"),checked=e.target.checked;field.classList.toggle("hidden",!checked);e.target.setAttribute("aria-expanded",String(checked));if(checked)setTimeout(()=>$("#retirementSimulationMonthlyContribution").focus(),0)};$("#addRetirementCdb")'
          new_events='$("#retirementSimulationBoost").onchange=e=>{retirementSimulationBoost=e.target.checked;saveRetirementSimulationLocal();renderProjections();queueCloudSync();if(retirementSimulationBoost)setTimeout(()=>$("#retirementSimulationMonthlyContribution").focus(),0)};$("#retirementSimulationMonthlyContribution").onchange=e=>{retirementSimulationMonthlyContribution=Math.max(0,parse(e.target.value)||0);saveRetirementSimulationLocal();renderProjections();queueCloudSync()};$("#retirementSimulationMonthlyContribution").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur()}});$("#addRetirementCdb")'
          rep(old_events,new_events,'monthly contribution events')

          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Include monthly contributions in retirement scenarios"
          git push origin main
