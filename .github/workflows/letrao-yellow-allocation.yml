name: Letrao yellow sidebar and allocation
on:
  push:
    paths:
      - '.github/workflows/letrao-yellow-allocation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Letrao-only visual updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          if "meu-patrimonio-pwa-v16" not in s:
              raise SystemExit('Expected cache v16 not found')
          s = s.replace("meu-patrimonio-pwa-v16", "meu-patrimonio-pwa-v17", 1)
          anchor = '  body.letrao-mode nav .nav span svg{width:22px;height:22px}\n'
          additions = '  body.letrao-mode nav::before,\n  body.letrao-mode nav .nav,\n  body.letrao-mode nav .nav:hover,\n  body.letrao-mode nav .nav.active,\n  body.letrao-mode nav .nav small,\n  body.letrao-mode nav .nav span,\n  body.letrao-mode nav .nav svg{color:#f6d65b!important}\n\n  body.letrao-mode #home .allocation-overview{grid-template-columns:380px minmax(0,1fr);gap:52px}\n  body.letrao-mode #home .allocation-chart{width:360px}\n  body.letrao-mode #home .allocation-chart::before{width:232px}\n  body.letrao-mode #home .allocation-legend{gap:20px}\n  body.letrao-mode #home .allocation-legend-item{grid-template-columns:14px minmax(0,1fr) auto;gap:14px;font-size:1.52rem;line-height:1.25}\n  body.letrao-mode #home .allocation-legend-item i{width:14px;height:14px}\n  body.letrao-mode #home .allocation-legend-item b{font-size:1.44rem}\n'
          if anchor not in s:
              raise SystemExit('Expected Letrao nav style anchor not found')
          if 'body.letrao-mode #home .allocation-chart{width:360px}' in s:
              raise SystemExit('Allocation enlargement already present')
          s = s.replace(anchor, anchor + additions, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Improve Letrao sidebar and allocation readability"
          git push
