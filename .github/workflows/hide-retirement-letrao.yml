name: Hide retirement in Letrao
on:
  push:
    paths:
      - '.github/workflows/hide-retirement-letrao.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide retirement references in simplified mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("meu-patrimonio-pwa-v12", "meu-patrimonio-pwa-v13", 1)
          needle = "  body.letrao-mode #home #graphBtn,\n  body.letrao-mode #evolution .rowact,\n"
          replacement = "  body.letrao-mode #home #graphBtn,\n  body.letrao-mode #projections .projection-target:has(+ .wealth-split),\n  body.letrao-mode #projections .wealth-split,\n  body.letrao-mode #projections .wealth-check,\n  body.letrao-mode #projections .wealth-warning,\n  body.letrao-mode #projections .retirement-simulation,\n  body.letrao-mode #retirementSimulationCapitalSheet,\n  body.letrao-mode #retirementSheet,\n  body.letrao-mode #evolution .rowact,\n"
          if needle not in s:
              raise SystemExit('Expected Letrao selector block not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Hide retirement references in Modo Letrao"
          git push
