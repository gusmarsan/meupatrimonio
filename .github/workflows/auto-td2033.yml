name: Implement automatic TD 2033
on:
  push:
    paths:
      - '.github/workflows/auto-td2033.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TD 2033 patch
        run: python .github/scripts/auto_td2033.py
      - name: Validate JavaScript and TD 2033 calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'id="tdReal2033Value"' in html
          assert 'id="tdReal2033Input"' not in html
          assert 'id="saveTdRealValues"' not in html
          assert 'td2033Coupons()' in html
          module=html.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/meupatrimonio-main.mjs').write_text(module)
          PY
          node --check /tmp/meupatrimonio-main.mjs
          node --check sw.js
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const code=html.match(/const TD2033_QUANTITY=.*?function renderTdReal2033\(\)/s)?.[0];
          if(!code)throw new Error('TD2033 calculation is missing');
          const raw=code.slice(0,code.indexOf('function renderTdReal2033()'));
          const calc=Function(raw+'return {td2033Theory,td2033PriceAt,td2033Coupons,TD2033_COUPON_DATES,TD2033_INITIAL}')();
          const buy=Date.UTC(2023,1,15),today=Date.UTC(2026,10,17);
          const initial=calc.td2033PriceAt(buy);
          const result=calc.td2033Theory(today);
          console.log(JSON.stringify({initial,gross:result.gross,net:result.net,b3:result.b3,couponsPaid:result.couponsPaid,days:result.days}));
          if(Math.abs(initial-843.83)>0.001)throw new Error('Original purchase price not respected');
          if(result.couponsPaid!==7)throw new Error('Incorrect number of historical coupon payments');
          if(!(result.net>48000&&result.net<54000))throw new Error('Unreasonable theoretical net value');
          if(Math.abs(result.b3-35.94)>0.001)throw new Error('B3 anchor is not respected');
          JS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Automate TD 2033 theoretical value with semiannual coupons"
          git push
