<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f4ef">
  <title>Instalar Meu Patrimônio</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#17201b;background:#f3f4ef}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,#dcefe6,transparent 35%),#f3f4ef}.card{width:min(100%,430px);padding:28px;border:1px solid #18201c1a;border-radius:28px;background:#fff;box-shadow:0 24px 60px #17201b18;text-align:center}.icon{width:132px;height:132px;margin:0 auto 22px;display:block;filter:drop-shadow(0 14px 24px #0a24452b)}h1{margin:0 0 9px;font-size:1.75rem;letter-spacing:-.035em}p{margin:0;color:#68736d;line-height:1.5}.button{width:100%;min-height:52px;margin-top:24px;border:0;border-radius:16px;background:#137a52;color:#fff;font-weight:800;font-size:1rem}.button:disabled{opacity:.55}.secondary{display:inline-block;margin-top:14px;color:#137a52;text-decoration:none;font-weight:750;font-size:.9rem}.hint{margin-top:18px;padding:13px 14px;border-radius:14px;background:#f3f4ef;color:#68736d;font-size:.78rem;line-height:1.45;text-align:left}.status{min-height:20px;margin-top:12px;color:#68736d;font-size:.76rem}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./icon.svg" alt="Ícone do Meu Patrimônio">
    <h1>Meu Patrimônio</h1>
    <p>Instale a versão atual do app na tela inicial do celular.</p>
    <button id="installButton" class="button" disabled>Preparando instalação…</button>
    <a class="secondary" href="./index.html">Abrir sem instalar</a>
    <div class="hint">Se o botão de instalação não aparecer, abra o menu <strong>⋮</strong> do Chrome e escolha <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>.</div>
    <div id="status" class="status"></div>
  </main>
<script>
let deferredPrompt = null;
const button = document.getElementById('installButton');
const status = document.getElementById('status');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(() => {
    status.textContent = 'App pronto para instalação.';
  }).catch(() => {
    status.textContent = 'Não foi possível preparar a instalação automática.';
  });
}

window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredPrompt = event;
  button.disabled = false;
  button.textContent = 'Instalar no celular';
});

button.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  button.disabled = true;
  button.textContent = 'Instalação solicitada';
});

window.addEventListener('appinstalled', () => {
  status.textContent = 'Meu Patrimônio foi instalado.';
  button.disabled = true;
  button.textContent = 'App instalado';
});

setTimeout(() => {
  if (!deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
    button.disabled = true;
    button.textContent = 'Use o menu ⋮ do Chrome';
  }
}, 3500);
</script>
</body>
</html>
